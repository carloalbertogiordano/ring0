# In-process: on this machine loopback shows up as 192.168.1.49 and the Gradle daemon refuses the client.
# GRADLE_OPTS in gw.sh must match org.gradle.jvmargs, otherwise Gradle forks a daemon.
org.gradle.jvmargs=-Xmx3g -Xms256m -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
kotlin.code.style=official
# Faster builds: the configuration is reused between runs
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
org.gradle.vfs.watch=false

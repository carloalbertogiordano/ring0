# In-process: su questa macchina il loopback arriva come 192.168.1.49 e il daemon Gradle rifiuta il client.
# GRADLE_OPTS in gw.sh deve coincidere con org.gradle.jvmargs, altrimenti Gradle forka un daemon.
org.gradle.jvmargs=-Xmx3g -Xms256m -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
kotlin.code.style=official

name: Release

# Runs only for a version tag created by the maintainer, and only after the maintainer approves the "release" environment,
# which is the only place the signing key lives (as encrypted secrets). Forks and pull requests never see it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Signed release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write      # create the GitHub release
      id-token: write      # provenance attestation
      attestations: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Quality gate and tests
        run: ./gradlew qualityGate :protocol:runTests :domain:runTests
      - name: Decode the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          umask 077
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
      - name: Build the signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease -PversionName="${GITHUB_REF_NAME#v}" -PversionCode="${{ github.run_number }}"
      - name: Verify the signature and name the file
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$ANDROID_HOME"/build-tools/*/apksigner verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
          cp "$APK" "ring0-${GITHUB_REF_NAME}.apk"
          sha256sum "ring0-${GITHUB_REF_NAME}.apk" | tee "ring0-${GITHUB_REF_NAME}.apk.sha256"
          rm -f "$RUNNER_TEMP/release.p12"
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: android/ring0-${{ github.ref_name }}.apk
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "ring0-${GITHUB_REF_NAME}.apk" "ring0-${GITHUB_REF_NAME}.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" --title "Ring0 ${GITHUB_REF_NAME}" --generate-notes

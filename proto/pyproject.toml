[project]
name = "ringproto"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["bleak"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=ringproto --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PL", "RET", "PT", "S", "ANN", "D100", "D103"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN", "D", "PLR2004"]
"*.py" = ["D100"]

[tool.mypy]
strict = true
files = ["ringproto"]

[tool.pylint.main]
ignore = [".venv"]
[tool.pylint.design]
max-attributes = 12
[tool.pylint.similarities]
min-similarity-lines = 4
ignore-imports = true
[tool.pylint.messages_control]
disable = ["too-few-public-methods", "missing-module-docstring", "missing-function-docstring", "missing-class-docstring"]

[tool.coverage.run]
# I/O reale: verificato col ring, non con unit test
omit = ["ringproto/connect.py", "ringproto/cli.py"]
